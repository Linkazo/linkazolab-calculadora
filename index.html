<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d14">
<title>Calculadora Linkazo Lab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#0b0d14;--panel:#121622;--line:#262d40;--fg:#e6edf5;--muted:#8b95a8;--green:#39ff14;--cyan:#00d8f0;--bad:#ff5470;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Inter",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.logo{font:900 22px "Orbitron",system-ui,sans-serif;letter-spacing:.06em;text-align:center;text-shadow:0 0 8px rgba(57,255,20,.35)}
.logo b{color:var(--cyan)} .logo i{font-style:normal;color:var(--green)}
.sub{color:var(--muted);font-size:13px;text-align:center;margin-top:-8px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
input[type=password]{background:#181d2c;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:11px 12px;font:16px "Inter",system-ui,sans-serif}
input:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.rec{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.rec input{width:17px;height:17px;accent-color:var(--green)}
button{background:var(--green);color:#071003;border:0;border-radius:8px;padding:11px;font:700 14px "Inter",system-ui,sans-serif;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:18px;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo"><i>●</i> LINKAZO <b>LAB</b></div>
  <div class="sub">Calculadora de precios</div>
  <input type="text" name="username" value="linkazolab" autocomplete="username" hidden>
  <label>Contraseña<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
  <label class="rec"><input type="checkbox" id="rec" checked> Recordar en este dispositivo</label>
  <button id="go">Entrar</button>
  <div class="err" id="err"></div>
</form>

async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close()}
const KEY='lkz_calc_pw';
(async()=>{
  let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){try{show(await open_(saved));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value,btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Abriendo…';err.textContent='';
  try{
    const html=await open_(pw);
    if(document.getElementById('rec').checked){try{localStorage.setItem(KEY,pw)}catch(_){}}
    show(html);
  }catch(x){err.textContent='Contraseña incorrecta.';btn.disabled=false;btn.textContent='Entrar';document.getElementById('pw').select()}
});
